name: Generate Pine Script

on:
  push:
    branches: [main]
    paths:
      - "data/events-*.md"
  pull_request:
    paths:
      - "data/events-*.md"
      - "worldwide-events.pine"
      - "scripts/**"

concurrency:
  group: generate-events-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Run generator tests
        run: python scripts/test_generate.py

      - name: Validate event data
        run: python scripts/check-events.py --no-http

      - name: Generate worldwide-events.pine
        run: python scripts/generate-events.py

      # On a pull request the committed Pine file must already match the data;
      # regenerating is a push-to-main job, so drift fails the build instead.
      - name: Check for drift
        if: github.event_name == 'pull_request'
        run: git diff --exit-code worldwide-events.pine

      - name: Commit updated Pine Script
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add worldwide-events.pine
          git diff --cached --quiet || git commit -m "Regenerate worldwide-events.pine"
          git push
